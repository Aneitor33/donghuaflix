<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="DonghuaFlix — Donghuas, películas y series en alta calidad.">
  <title>DonghuaFlix</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=15">
  <link rel="stylesheet" href="dfx.css">
  <!-- RENACER: todas las fases -->
  <link rel="stylesheet" href="dfx-renacer.css">
  <link rel="stylesheet" href="dfx-renacer-fase2.css">
  <link rel="stylesheet" href="dfx-renacer-fase3.css">
  <link rel="stylesheet" href="dfx-renacer-fase4.css">
  <link rel="stylesheet" href="dfx-renacer-fase5.css">
  <link rel="stylesheet" href="dfx-renacer-fase6.css">
</head>
<body>

  <div class="bg-ambience" id="bgAmbience"></div>

  <header class="nav">
    <a class="brand" href="#/">
      <span class="brand-mark"><img src="icon-192.png" alt="DonghuaFlix"></span>
      <span>Donghua<b>Flix</b></span>
    </a>
    <nav>
      <a href="#/" data-nav>Inicio</a>
      <a href="#/series" data-nav>Series</a>
      <a href="#/movies" data-nav>Películas</a>
      <a href="#/airing" data-nav>En emisión</a>
      <a href="#/completed" data-nav>Finalizadas</a>
      <a href="#/genres" data-nav>Géneros</a>
      <a href="#/mylist" data-nav>Mi lista</a>
    </nav>
    <div class="catalog-wrap" id="catalogWrap" style="display:none">
      <button class="catalog-fab" onclick="toggleCatalogMenu()" title="Cambiar catálogo" aria-label="Cambiar catálogo">
        <img src="icon-192.png" alt="">
        <svg class="fab-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="catalog-menu" id="catalogMenu">
        <button data-cat="donghualife" onclick="switchCatalog('donghualife')">DonghuaLife</button>
        <button data-cat="donghuasub" onclick="switchCatalog('donghuasub')">DonghuaSub</button>
        <button data-cat="donghuaworld" onclick="switchCatalog('donghuaworld')">DonghuaWorld</button>
        <button data-cat="peliculas" onclick="switchCatalog('peliculas')">Películas</button>
        <button data-cat="doramas" onclick="switchCatalog('doramas')">Doramas</button>
      </div>
    </div>
    <div class="nav-actions">
      <a href="#/search" class="icon-btn" title="Buscar" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </a>
      <button id="reloadBtn" class="icon-btn" title="Actualizar catálogo" aria-label="Actualizar catálogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <footer>
    <p id="footerStatus">Cargando catálogo...</p>
  </footer>

  <nav class="bottom-nav">
    <a href="#/" data-nav>Inicio</a>
    <a href="#/series" data-nav>Series</a>
    <a href="#/movies" data-nav>Películas</a>
    <a href="#/search" data-nav>Buscar</a>
    <a href="#/mylist" data-nav>Mi lista</a>
    <button onclick="toggleMoreMenu()">Más</button>
  </nav>

  <div class="more-menu" id="moreMenu">
    <a href="#/airing">En emisión</a>
    <a href="#/completed">Finalizadas</a>
    <a href="#/genres">Géneros</a>
  </div>

  <button id="toTop" class="to-top" title="Volver arriba" aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <div id="toast" role="status"></div>

  <script src="app.js?v=19"></script>
  <!-- RENACER: fase 1 (home) -->
  <script src="dfx-renacer.js"></script>
  <!-- RENACER: fase 2 (personalización/descubrimiento) -->
  <script src="dfx-renacer-fase2.js"></script>
  <!-- RENACER: fase 3 (detalle de título) -->
  <script src="dfx-renacer-fase3.js"></script>
  <script type="module" src="firebase-sync.js"></script>
  <script>
    // DonghuaFlix Pro: espera a que app.js registre sus funciones y luego carga los módulos
    window.addEventListener('load', function () {
      setTimeout(function () {
        var s1 = document.createElement('script');
        s1.src = 'dfx-core.js';
        s1.onload = function () {
          // RENACER: fase 4 (Tu DonghuaFlix) y fase 5 (Explorar) — tras el núcleo
          var s4 = document.createElement('script');
          s4.src = 'dfx-renacer-fase4.js';
          s4.onload = function () {
            var s5 = document.createElement('script');
            s5.src = 'dfx-renacer-fase5.js';
            document.body.appendChild(s5);
          };
          document.body.appendChild(s4);
          var s2 = document.createElement('script');
          s2.src = 'dfx-polish.js';
          document.body.appendChild(s2);
        };
        document.body.appendChild(s1);
      }, 400);
    });
  </script>
  <!-- RENACER: fase 6 (rendimiento) lo antes posible para envolver fetch -->
  <script src="dfx-renacer-fase6.js"></script>
</body>
</html>
