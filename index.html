<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="DonghuaFlix — Donghuas, películas y series en alta calidad.">
  <title>DonghuaFlix</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=26">

  <!-- ═══ AUTODIAGNÓSTICO (temporal): muestra en pantalla cualquier
       error JS y, a los 6 s, el estado de cada archivo. Cuando la web
       vaya bien, se quita este bloque entero. ═══ -->
  <script>
  (function () {
    var box = null;
    function show(msg) {
      if (!box) {
        box = document.createElement('pre');
        box.id = 'dfxDiag';
        box.style.cssText = 'position:fixed;top:66px;left:8px;right:8px;z-index:2147483647;background:rgba(24,0,0,.94);color:#ff9a9a;border:1.5px solid #ff4040;border-radius:10px;padding:10px 12px;font:12px/1.55 monospace;white-space:pre-wrap;max-height:55vh;overflow:auto';
        document.documentElement.appendChild(box);
      }
      box.textContent += msg + '\n';
    }
    window.addEventListener('error', function (e) {
      var f = (e.filename || '').split('/').pop();
      show('ERROR: ' + (e.message || e.type) + '  @  ' + f + ':' + e.lineno);
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      show('PROMESA: ' + (r && (r.message || r)));
    });
    setTimeout(function () {
      try {
        var files = ['app.js?v=26','dfx-core.js?v=26','dfx-polish.js?v=26','dfx-boot.js?v=26','firebase-sync.js?v=26','styles.css?v=26','public/data/catalog-donghualife-index.json'];
        var chain = Promise.resolve();
        files.forEach(function (f) {
          chain = chain.then(function () {
            return fetch(f, { cache: 'no-store' }).then(function (r) {
              if (!r.ok) show('FALTA: ' + f + ' -> HTTP ' + r.status);
            }).catch(function () { show('FALTA: ' + f + ' -> red/CORS'); });
          });
        });
        chain.then(function () {
          show('--- estado de la app ---');
          show('home: ' + typeof window.home + ' | route: ' + typeof window.route + ' | DFX: ' + typeof window.DFX + ' | DB expuesta: ' + ('DB' in window));
          var app = document.getElementById('app');
          show('#app contenido: ' + (app ? app.innerHTML.length : 'no existe') + ' caracteres');
          var cw = document.getElementById('catalogWrap');
          show('selector catálogo: ' + (cw ? cw.style.display : 'no existe en el HTML'));
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            show('SW activo: ' + navigator.serviceWorker.controller.scriptURL.split('/').pop());
          } else {
            show('SW activo: ninguno todavia');
          }
          if ('caches' in window) {
            caches.keys().then(function (ks) { show('caches: ' + (ks.join(', ') || 'ninguna')); });
          }
          if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) {
                show('registro SW: ' + (r.active ? 'activo' : 'pendiente') + ' ' + r.scope);
              });
            });
          }
          var fix = document.createElement('button');
          fix.textContent = 'Reparar cache (desregistra SW, borra caches y recarga)';
          fix.style.cssText = 'margin-top:8px;background:#e50914;color:#fff;border:none;border-radius:8px;padding:8px 12px;font:700 12px inherit;cursor:pointer';
          fix.onclick = function () {
            fix.textContent = 'Reparando...';
            Promise.all([
              navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(rs.map(function (r) { return r.unregister(); }));
              }) : Promise.resolve(),
              'caches' in window ? caches.keys().then(function (ks) {
                return Promise.all(ks.map(function (k) { return caches.delete(k); }));
              }) : Promise.resolve()
            ]).then(function () { location.reload(); });
          };
          box.appendChild(fix);
        });
      } catch (err) { show('diag: ' + err.message); }
    }, 6000);
  })();
  </script>
</head>
<body>

  <!-- FONDO AMBIENTE (cristal líquido) -->
  <div class="bg-ambience" id="bgAmbience"></div>

  <!-- BARRA SUPERIOR ÚNICA: logo + menú + selector de catálogo + acciones -->
  <header class="nav">
    <a class="brand" href="#/">
      <span class="brand-mark"><img src="icon-192.png" alt="DonghuaFlix"></span>
      <span>Donghua<b>Flix</b></span>
    </a>
    <nav>
      <a href="#/" data-nav>Inicio</a>
      <a href="#/series" data-nav>Series</a>
      <a href="#/movies" data-nav>Películas</a>
      <a href="#/airing" data-nav>En emisión</a>
      <a href="#/completed" data-nav>Finalizadas</a>
      <a href="#/genres" data-nav>Géneros</a>
      <a href="#/mylist" data-nav>Mi lista</a>
    </nav>
    <div class="catalog-wrap" id="catalogWrap" style="display:none">
      <button class="catalog-fab" onclick="toggleCatalogMenu()" title="Cambiar catálogo" aria-label="Cambiar catálogo">
        <img src="icon-192.png" alt="">
        <svg class="fab-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="catalog-menu" id="catalogMenu">
        <button data-cat="donghualife" onclick="switchCatalog('donghualife')">DonghuaLife</button>
        <button data-cat="donghuasub" onclick="switchCatalog('donghuasub')">DonghuaSub</button>
        <button data-cat="donghuaworld" onclick="switchCatalog('donghuaworld')">DonghuaWorld</button>
        <button data-cat="peliculas" onclick="switchCatalog('peliculas')">Películas</button>
        <button data-cat="doramas" onclick="switchCatalog('doramas')">Doramas</button>
      </div>
    </div>
    <div class="nav-actions">
      <a href="#/search" class="icon-btn" title="Buscar" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </a>
      <button id="reloadBtn" class="icon-btn" title="Actualizar catálogo" aria-label="Actualizar catálogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
      </button>
      <button id="dfsAuthBtn" class="icon-btn" title="Mi cuenta" aria-label="Mi cuenta"
        onclick="window.__dfsOpenModal ? window.__dfsOpenModal() : (window.showToast && showToast('Cargando módulo de cuenta…'))">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.8 3.9-5.7 7.5-5.7s6.7 1.9 7.5 5.7"/></svg>
      </button>
    </div>
  </header>

  <!-- CONTENEDOR DE LA SPA -->
  <main id="app"></main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p id="footerStatus">Cargando catálogo...</p>
  </footer>

  <!-- BARRA INFERIOR (móvil) -->
  <nav class="bottom-nav">
    <a href="#/" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Inicio</a>
    <a href="#/series" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2.5"/><path d="M8 3l4 4 4-4"/></svg>
      Series</a>
    <a href="#/movies" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 16h18M8 3v18M16 3v18"/></svg>
      Películas</a>
    <a href="#/search" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Buscar</a>
    <a href="#/mylist" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6a5.3 5.3 0 0 1 9.3 4.9c-1.8 4.4-9.3 9-9.3 9z"/></svg>
      Mi lista</a>
    <button onclick="toggleMoreMenu()">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      Más</button>
  </nav>

  <!-- MENÚ "MÁS" -->
  <div class="more-menu" id="moreMenu">
    <a href="#/airing">En emisión</a>
    <a href="#/completed">Finalizadas</a>
    <a href="#/genres">Géneros</a>
  </div>

  <!-- BOTÓN VOLVER ARRIBA -->
  <button id="toTop" class="to-top" title="Volver arriba" aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <!-- NOTIFICACIONES -->
  <div id="toast" role="status"></div>

  <!-- DonghuaFlix: capas en orden determinista. -->
  <script src="app.js?v=26"></script>
  <script src="dfx-core.js?v=26"></script>
  <script src="dfx-polish.js?v=26"></script>
  <script src="dfx-boot.js?v=26"></script>
  <script type="module" src="firebase-sync.js?v=26"></script>
</body>
</html>
