<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07080b">
  <meta name="description" content="DonghuaFlix — Catálogo de donghuas y animación china en alta calidad.">
  <title>DonghuaFlix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <header class="nav">
    <a class="brand" href="#/">
      <span class="brand-mark">▶</span>
      <span>Donghua<span style="color:var(--red)">Flix</span></span>
    </a>
    <nav>
      <a href="#/" data-nav>Inicio</a>
      <a href="#/series" data-nav>Series</a>
      <a href="#/movies" data-nav>Películas</a>
      <a href="#/airing" data-nav>En emisión</a>
      <a href="#/completed" data-nav>Finalizadas</a>
      <a href="#/genres" data-nav>Géneros</a>
    </nav>
    <div class="nav-actions">
      <a href="#/search" class="icon-btn" title="Buscar" aria-label="Buscar">🔍</a>
      <button id="reloadBtn" class="icon-btn" title="Actualizar catálogo" aria-label="Actualizar catálogo">⟳</button>
    </div>
  </header>

  <!-- CONTENEDOR DINÁMICO DE LA SPA -->
  <main id="app"></main>

  <!-- PIE DE PÁGINA -->
  <footer>
    <p id="footerStatus">Cargando catálogo...</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
