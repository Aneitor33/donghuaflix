<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DonghuaFlix</title>
  <link rel="stylesheet" href="styles.css"> 
</head>
<body>

  <!-- BARRA DE NAVEGACIÓN SUPERIOR ORIGINAL -->
  <header class="header">
    <div class="logo">
      <a href="#/">DONGHUAFLIX</a>
    </div>
    <nav>
      <a href="#/">Inicio</a>
      <a href="#/series">Series</a>
      <a href="#/genres">Géneros</a>
      <a href="#/movies">Películas</a>
      <a href="#/airing">En emisión</a>
      <a href="#/completed">Finalizadas</a>
    </nav>
    <div class="nav-actions">
      <a href="#/search" class="icon-btn" title="Buscar">🔍</a>
      <button id="reloadBtn" class="icon-btn" title="Actualizar catálogo">🔄</button>
    </div>
  </header>

  <!-- CONTENEDOR DINÁMICO DE LA SPA -->
  <main id="app">
    <!-- El contenido se renderiza dinámicamente mediante app.js -->
  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="footer">
    <div id="footerStatus">Cargando catálogo...</div>
  </footer>

  <!-- SCRIPT PRINCIPAL -->
  <script src="app.js"></script>
</body>
</html>
