<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="DonghuaFlix — Donghuas, películas y series en alta calidad.">
  <title>DonghuaFlix</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css?v=15">
  <link rel="stylesheet" href="dfx.css">
  <link rel="stylesheet" href="dfx-final.css?v=7">
  <style>
    /* Paginación nueva: elipsis + salto directo */
    .pg-dots{color:#9a9aa5;padding:0 4px;align-self:center}
    .pg-jump{display:flex;align-items:center;gap:6px;color:#9a9aa5;font-size:12px;margin-left:8px}
    .pg-jump input{width:64px;background:#1d1d24;border:1px solid #333;color:#fff;border-radius:8px;padding:6px 8px;font-size:12px}
  </style>
</head>
<body>
  <div class="bg-ambience" id="bgAmbience"></div>

  <header class="nav">
    <a class="brand" href="#/">
      <span class="brand-mark"><img src="icon-192.png" alt="DonghuaFlix"></span>
      <span>Donghua<b>Flix</b></span>
    </a>
    <nav>
      <a href="#/" data-nav>Inicio</a>
      <a href="#/series" data-nav>Series</a>
      <a href="#/airing" data-nav>En emisión</a>
      <a href="#/genres" data-nav>Géneros</a>
      <a href="#/descubrir" data-nav>Descubrir</a>
      <a href="#/mylist" data-nav>Mi lista</a>
      <a href="#/mi-donghua" data-nav>Mi Donghua</a>
    </nav>
    <div class="catalog-wrap" id="catalogWrap" style="display:none">
      <button class="catalog-fab" onclick="toggleCatalogMenu()" title="Cambiar catálogo" aria-label="Cambiar catálogo">
        <img src="icon-192.png" alt="">
        <svg class="fab-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div class="catalog-menu" id="catalogMenu"></div>
    </div>
    <div class="nav-actions">
      <a href="#/search" class="icon-btn" title="Buscar" aria-label="Buscar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </a>
      <button id="reloadBtn" class="icon-btn" title="Actualizar catálogo" aria-label="Actualizar catálogo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
      </button>
    </div>
  </header>

  <main id="app"></main>

  <footer><p id="footerStatus">Cargando catálogo...</p></footer>

  <nav class="bottom-nav">
    <a href="#/" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      Inicio</a>
    <a href="#/series" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2.5"/><path d="M8 3l4 4 4-4"/></svg>
      Series</a>
    <a href="#/movies" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 16h18M8 3v18M16 3v18"/></svg>
      Películas</a>
    <a href="#/search" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      Buscar</a>
    <a href="#/mylist" data-nav>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 20.5s-7.5-4.6-9.3-9A5.3 5.3 0 0 1 12 6.6a5.3 5.3 0 0 1 9.3 4.9c-1.8 4.4-9.3 9-9.3 9z"/></svg>
      Mi lista</a>
    <button onclick="toggleMoreMenu()">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      Más</button>
  </nav>

  <div class="more-menu" id="moreMenu">
    <a href="#/movies"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="vertical-align:-3px;margin-right:8px"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 8h18M3 16h18M8 3v18M16 3v18"/></svg>Películas</a>
    <a href="#/airing"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="vertical-align:-3px;margin-right:8px"><rect x="2" y="7" width="20" height="14" rx="2.5"/><path d="M8 3l4 4 4-4"/></svg>En emisión</a>
    <a href="#/completed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="vertical-align:-3px;margin-right:8px"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Finalizadas</a>
    <a href="#/genres"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="vertical-align:-3px;margin-right:8px"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>Géneros</a>
    <a href="#/descubrir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="vertical-align:-3px;margin-right:8px"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Descubrir</a>
    <a href="#/mi-donghua"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="vertical-align:-3px;margin-right:8px"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.8-3.8 3.9-5.7 7.5-5.7s6.7 1.9 7.5 5.7"/></svg>Mi Donghua</a>
    <a href="#" onclick="event.preventDefault();toggleMoreMenu();window.dfxOpenSettings&&dfxOpenSettings();"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="17" height="17" style="vertical-align:-3px;margin-right:8px"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.14-1.4l2-1.55-2-3.46-2.35.94A7 7 0 0 0 14.1 5.1L13.75 2.6h-3.5L9.9 5.1a7 7 0 0 0-2.41 1.43l-2.35-.94-2 3.46 2 1.55a7 7 0 0 0 0 2.8l-2 1.55 2 3.46 2.35-.94a7 7 0 0 0 2.41 1.43l.35 2.5h3.5l.35-2.5a7 7 0 0 0 2.41-1.43l2.35.94 2-3.46-2-1.55A7 7 0 0 0 19 12z"/></svg>Ajustes</a>
  </div>

  <button id="toTop" class="to-top" title="Volver arriba" aria-label="Volver arriba">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
  </button>

  <div id="toast" role="status"></div>

  <script src="app.js?v=25"></script>
  <script type="module" src="firebase-sync.js"></script>
  <script src="dfx-core.js"></script>
</body>
</html>
