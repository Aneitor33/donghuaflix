# .github/workflows/dhua-sync.yml
# Scrapea catálogo vía donghua-cli y publica los JSON en el repo.
# Requiere: requirements.txt en la raíz (con punto: requirements.txt)
name: donghua-cli sync

on:
  schedule:
    - cron: "0 4 * * *"        # diario 04:00 UTC (crawl completo)
  workflow_dispatch:            # botón manual en la pestaña Actions
    inputs:
      max_series:
        description: "Máx. series a scrapear (0 = todas). Usa p.ej. 30 para probar."
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: dhua-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Cache del catálogo anterior
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/donghua-cli
            public/data/catalog-donghuacli.json
          key: dhua-catalog-${{ github.run_id }}
          restore-keys: dhua-catalog-

      - name: Scrapear catálogo con donghua-cli (crawl completo de las fuentes)
        env:
          PYTHONUNBUFFERED: "1"
          DHUA_MAX_SERIES: ${{ github.event.inputs.max_series || '0' }}
        run: python sync-donghua-cli.py --crawl-sites --workers 8 --max-series "$DHUA_MAX_SERIES"

      - name: Commit y push de los JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/catalog-donghuacli.json \
                  public/data/catalog-donghuacli-index.json \
                  public/data/catalog-donghuacli-details/
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
          else
            git commit -m "chore(dhua): sync catálogo donghua-cli"
            git push
          fi

  # ── Opcional: despliega/reinicia el servicio de resolución ─────────
  resolver:
    needs: sync
    if: false   # ← ponlo en true cuando tengas dónde desplegarlo
    runs-on: ubuntu-latest
    steps:
      - name: Ping deploy hook del resolutor
        run: curl -fsSL -X POST "${{ secrets.DHUA_RESOLVER_DEPLOY_HOOK }}"
