name: Flyflix Tester

on:
  push:
    paths:
      - flyflix_tester.py
      - flyflix_config.yml
      - .github/workflows/flyflix_test.yml
  workflow_dispatch:      # permite ejecutarlo manualmente

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install playwright pyyaml
          playwright install --with-deps chromium

      - name: Ejecutar tester
        run: python flyflix_tester.py --headless --config flyflix_config.yml
        continue-on-error: true   # guarda resultados aunque falle Cloudflare

      - name: Subir resultados
        uses: actions/upload-artifact@v4
        with:
          name: flyflix-results
          path: |
            flyflix_test_results.json
            shot_*.png
          retention-days: 7
