name: doramasia backfill

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'En cuántas partes dividir el trabajo (mismo valor que el run original al fusionar)'
        required: true
        default: '8'
        type: choice
        options: ['4', '6', '8']
      rebuild:
        description: 'REBUILD: borra el catálogo y lo reconstruye desde 0 (solo contenido con vídeo). Copia de seguridad automática con restauración si sale mal.'
        required: false
        type: boolean
        default: false
      merge_run_id:
        description: 'RESCATE: ID del run cancelado cuyos artefactos fusionar (vacío = comportamiento normal)'
        required: false
        default: ''
        type: string
      merge_artifact_ids:
        description: 'RESCATE (recomendado): IDs de artefactos exactos, separados por comas. Evita mezclar intentos.'
        required: false
        default: ''
        type: string

concurrency:
  group: doramasia-backfill
  cancel-in-progress: false

jobs:
  # Solo en modo rebuild: copia de seguridad del catálogo + borrado + redescubrimiento
  # de series (MODE=full con FRESH=1). Genera el catálogo base y los raws que
  # los shards usarán para rastrear los vídeos.
  prepare:
    if: ${{ inputs.rebuild && inputs.merge_run_id == '' && inputs.merge_artifact_ids == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar Playwright + Chromium
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Copia de seguridad del catálogo
        run: |
          if [ -f public/data/catalog-doramasia.json ]; then
            mkdir -p /tmp/backup
            cp public/data/catalog-doramasia.json /tmp/backup/catalog-doramasia.json
            node -e "const db=require('/tmp/backup/catalog-doramasia.json'); console.log('💾 Backup: ' + db.series.length + ' series, ' + (db.episodes||[]).length + ' episodios')"
          else
            echo "No hay catálogo previo; se construye desde cero."
          fi

      - name: Subir copia de seguridad (artefacto)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: catalog-backup
          path: /tmp/backup/catalog-doramasia.json
          if-no-files-found: ignore
          retention-days: 7

      - name: 'Rebuild: borrar catálogo y redescubrir series'
        env:
          MODE: full
          FRESH: '1'
          WORKERS: '10'
          HOST_LIMIT: '8'
          FETCH_TIMEOUT_MS: '20000'
          FETCH_RETRIES: '2'
          POLITENESS_MS: '300'
          MAX_RUNTIME_MINUTES: '320'
          MAX_EPISODE_CRAWLS: '50000'
          USE_PLAYWRIGHT: '1'
          FLIX_PROXY_HOSTS: 'doramasia.com,www.doramasia.com'
          FLIX_PROXY_URL: ${{ secrets.FLIX_PROXY_URL }}
          FLIX_PROXY_KEY: ${{ secrets.FLIX_PROXY_KEY }}
        run: node sync-doramasia.js

      - name: Guardar catálogo base y raws
        if: ${{ always() }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data || true
          if git diff --staged --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "chore(data): rebuild - catálogo base de DoramasIA"
          git pull --rebase origin main || true
          git push || echo "⚠️ Push falló; los shards no podrán leer los raws"

  # Cada runner procesa ~1/N de los episodios. NO tocan git:
  # suben su resultado como artefacto y el job merge se encarga del repo.
  episodes:
    needs: prepare
    # En modo rescate (merge_run_id o merge_artifact_ids != '') solo corre el merge
    if: ${{ inputs.merge_run_id == '' && inputs.merge_artifact_ids == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar Playwright + Chromium
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Rastrear servidores doramasia (shard ${{ matrix.shard }}/${{ inputs.shards }})
        env:
          MODE: episodes
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ inputs.shards }}
          USE_PLAYWRIGHT: '1'
          WORKERS: '10'
          HOST_LIMIT: '8'
          FETCH_TIMEOUT_MS: '20000'
          FETCH_RETRIES: '2'
          POLITENESS_MS: '300'
          MAX_RUNTIME_MINUTES: '320'
          MAX_EPISODE_CRAWLS: '50000'
          FLIX_PROXY_HOSTS: 'doramasia.com,www.doramasia.com'
          FLIX_PROXY_URL: ${{ secrets.FLIX_PROXY_URL }}
          FLIX_PROXY_KEY: ${{ secrets.FLIX_PROXY_KEY }}
        run: node sync-doramasia.js

      - name: Subir resultado del shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            public/data/catalog-doramasia-shard${{ matrix.shard }}.json
            public/data/catalog-doramasia-failures-shard${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  # Fusiona los shards y es el ÚNICO que commitea y pushea (sin conflictos)
  merge:
    needs: episodes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Descargar copia de seguridad (solo rebuild)
        if: ${{ inputs.rebuild }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: catalog-backup
          path: /tmp/backup

      - name: Descargar shards (de este run)
        if: ${{ inputs.merge_run_id == '' && inputs.merge_artifact_ids == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: public/data
          merge-multiple: true

      - name: Descargar shards (rescate por IDs exactos)
        if: ${{ inputs.merge_artifact_ids != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.merge_artifact_ids }}
          path: public/data
          merge-multiple: true

      - name: Descargar shards (rescate por run-id)
        if: ${{ inputs.merge_run_id != '' && inputs.merge_artifact_ids == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: public/data
          merge-multiple: true
          run-id: ${{ inputs.merge_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fusionar shards en el catálogo
        env:
          MODE: merge
          SHARD_TOTAL: ${{ inputs.shards }}
        run: node sync-doramasia.js

      - name: Seguridad del rebuild (restaura el backup si el resultado es demasiado pequeño)
        if: ${{ always() && inputs.rebuild }}
        run: |
          RESULT=$(node -e "const db=require('./public/data/catalog-doramasia.json'); console.log((db.series||[]).length + ' ' + (db.episodes||[]).length)")
          SERIES=$(echo $RESULT | cut -d' ' -f1)
          EPS=$(echo $RESULT | cut -d' ' -f2)
          echo "Resultado del rebuild: $SERIES series, $EPS episodios"
          if [ "$SERIES" -lt 800 ] || [ "$EPS" -lt 5000 ]; then
            if [ -f /tmp/backup/catalog-doramasia.json ]; then
              echo "::error::Rebuild demasiado pequeño ($SERIES series, $EPS eps). La extracción no está funcionando (revisa FLIX_PROXY_KEY). Restaurando la copia de seguridad..."
              cp /tmp/backup/catalog-doramasia.json public/data/catalog-doramasia.json
              rm -rf public/data/catalog-doramasia-index.json public/data/catalog-doramasia-details
              echo "Copia de seguridad restaurada."
            else
              echo "::error::Rebuild demasiado pequeño y no hay backup que restaurar."
            fi
          else
            echo "Rebuild dentro de lo esperado. Se conserva."
          fi

      - name: Dividir catálogo en índice + fichas
        run: node split-catalog.js public/data/catalog-doramasia.json

      - name: Guardar y enviar cambios al repositorio
        if: ${{ always() }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data || true
          if git diff --staged --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "chore(data): backfill de episodios de DoramasIA"
          # Reintenta el rebase/push en bucle: otros workflows commitean cada
          # minuto y pueden pisar el archivo entre nuestro add y el push
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            echo "Reintento $i tras conflicto de rebase"
            git rebase --abort 2>/dev/null || true
            git add -A public/data || true
            git commit --amend --no-edit || true
            sleep 10
          done

      - name: Verificar que el catálogo subido tiene episodios
        run: |
          EPISODES=$(node -e "const db=require('./public/data/catalog-doramasia.json'); console.log((db.episodes||[]).length)")
          SIZE=$(stat -c%s public/data/catalog-doramasia.json)
          echo "Episodios en el repo: $EPISODES | Tamaño: $SIZE bytes"
          if [ "$EPISODES" -lt 5000 ]; then
            echo "::error::El merge no quedó reflejado en el repo (solo $EPISODES episodios). Reintenta el merge."
            exit 1
          fi
