name: doramasia backfill

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'En cuántas partes dividir el trabajo (mismo valor que el run original al fusionar)'
        required: true
        default: '8'
        type: choice
        options: ['4', '6', '8']
      merge_run_id:
        description: 'RESCATE: ID del run cancelado cuyos artefactos fusionar (vacío = comportamiento normal)'
        required: false
        default: ''
        type: string
      merge_artifact_ids:
        description: 'RESCATE (recomendado): IDs de artefactos exactos, separados por comas. Evita mezclar intentos.'
        required: false
        default: ''
        type: string

concurrency:
  group: doramasia-backfill
  cancel-in-progress: false

jobs:
  # Cada runner procesa ~1/N de los episodios. NO tocan git:
  # suben su resultado como artefacto y el job merge se encarga del repo.
  episodes:
    # En modo rescate (merge_run_id o merge_artifact_ids != '') solo corre el merge
    if: ${{ inputs.merge_run_id == '' && inputs.merge_artifact_ids == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar Playwright + Chromium
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Rastrear servidores doramasia (shard ${{ matrix.shard }}/${{ inputs.shards }})
        env:
          MODE: episodes
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ inputs.shards }}
          USE_PLAYWRIGHT: '1'
          WORKERS: '8'
          HOST_LIMIT: '2'
          FETCH_TIMEOUT_MS: '20000'
          FETCH_RETRIES: '2'
          POLITENESS_MS: '300'
          MAX_RUNTIME_MINUTES: '320'
          MAX_EPISODE_CRAWLS: '50000'
          FLIX_PROXY_HOSTS: 'doramasia.com,www.doramasia.com'
          FLIX_PROXY_URL: ${{ secrets.FLIX_PROXY_URL }}
          FLIX_PROXY_KEY: ${{ secrets.FLIX_PROXY_KEY }}
        run: node sync-doramasia.js

      - name: Subir resultado del shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: |
            public/data/catalog-doramasia-shard${{ matrix.shard }}.json
            public/data/catalog-doramasia-failures-shard${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  # Fusiona los shards y es el ÚNICO que commitea y pushea (sin conflictos)
  merge:
    needs: episodes
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Descargar shards (de este run)
        if: ${{ inputs.merge_run_id == '' && inputs.merge_artifact_ids == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: public/data
          merge-multiple: true

      - name: Descargar shards (rescate por IDs exactos)
        if: ${{ inputs.merge_artifact_ids != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.merge_artifact_ids }}
          path: public/data
          merge-multiple: true

      - name: Descargar shards (rescate por run-id)
        if: ${{ inputs.merge_run_id != '' && inputs.merge_artifact_ids == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: public/data
          merge-multiple: true
          run-id: ${{ inputs.merge_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fusionar shards en el catálogo
        env:
          MODE: merge
          SHARD_TOTAL: ${{ inputs.shards }}
        run: node sync-doramasia.js

      - name: Dividir catálogo en índice + fichas
        run: node split-catalog.js public/data/catalog-doramasia.json

      - name: Guardar y enviar cambios al repositorio
        if: ${{ always() }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data || true
          if git diff --staged --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "chore(data): backfill de episodios de DoramasIA"
          # Reintenta el rebase/push en bucle: otros workflows commitean cada
          # minuto y pueden pisar el archivo entre nuestro add y el push
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              break
            fi
            echo "Reintento $i tras conflicto de rebase"
            git rebase --abort 2>/dev/null || true
            git add -A public/data || true
            git commit --amend --no-edit || true
            sleep 10
          done

      - name: Verificar que el catálogo subido tiene episodios
        run: |
          EPISODES=$(node -e "const db=require('./public/data/catalog-doramasia.json'); console.log((db.episodes||[]).length)")
          SIZE=$(stat -c%s public/data/catalog-doramasia.json)
          echo "Episodios en el repo: $EPISODES | Tamaño: $SIZE bytes"
          if [ "$EPISODES" -lt 5000 ]; then
            echo "::error::El merge no quedó reflejado en el repo (solo $EPISODES episodios). Reintenta el merge."
            exit 1
          fi
