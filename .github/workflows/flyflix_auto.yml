name: Flyflix Auto Scraper

on:
  schedule:
    - cron: "0 6 * * *"        # todos los días a las 06:00 UTC

# ⚠️ NUNCA dos runs a la vez: el nuevo se encola hasta que termine el activo
concurrency:
  group: flyflix-scraper
  cancel-in-progress: false
  workflow_dispatch:
    inputs:
      fuente:
        description: "Fuente del catálogo"
        required: true
        default: tmdb
        type: choice
        options:
          - flyflix
          - tmdb
      cantidad:
        description: "Top N (fuente tmdb) - máx real ~10,000 por tipo"
        required: true
        default: "2000"
        type: string
      workers:
        description: "Workers paralelos"
        required: true
        default: "50"
        type: string
      series_detalladas:
        description: "Series con estructura completa (resto: S1E1)"
        required: true
        default: "150"
        type: string
      tamano_chunk:
        description: "Títulos por chunk (checkpoint con commit)"
        required: true
        default: "200"
        type: string
      solo_empaquetar:
        description: "SALTAR scraping y builder - solo re-empaquetar shards del catalog-flyflix.json existente"
        required: true
        default: "no"
        type: choice
        options:
          - no
          - si

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias
        run: pip install requests pyyaml

      - name: Configurar git para checkpoints
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ── PASO 1: Scraper con checkpoints (reanudable) ──
      - name: 1/5 Scraper de URLs (con checkpoints)
        if: ${{ github.event.inputs.solo_empaquetar != 'si' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          mkdir -p resultados
          FUENTE="${{ github.event.inputs.fuente || 'tmdb' }}"
          WORKERS="${{ github.event.inputs.workers || '50' }}"
          CHUNK="${{ github.event.inputs.tamano_chunk || '200' }}"
          FECHA=$(date +%Y-%m-%d)
          if [ "$FUENTE" = "flyflix" ]; then
            SALIDA="resultados/$FECHA-flyflix.json"
            ARGS="--flyflix"
          else
            SALIDA="resultados/$FECHA-tmdb.json"
            ARGS="--auto ${{ github.event.inputs.cantidad || '2000' }} --fuente tmdb"
          fi
          for i in $(seq 1 200); do
            OUT=$(python flyflix_scraper.py $ARGS --workers "$WORKERS" \
                    --max "$CHUNK" --salida "$SALIDA" 2>&1)
            echo "$OUT" | tail -20
            if git add resultados/ && git commit -m "checkpoint scraper $i"; then
              for t in 1 2 3 4 5; do
                git pull --rebase --autostash && git push && break
                echo "push rechazado, reintentando en 10s..." && sleep 10
              done
            fi
            echo "$OUT" | grep -q "PENDIENTES:0" && break
          done

      # ── PASO 2: Builder TMDB con chunks y commit por chunk ──
      - name: 2/5 Construir catálogo (chunks reanudables)
        if: ${{ github.event.inputs.solo_empaquetar != 'si' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TV_DETAIL_LIMIT: ${{ github.event.inputs.series_detalladas || '150' }}
          SLEEP_MS: "260"
        run: |
          CHUNK="${{ github.event.inputs.tamano_chunk || '200' }}"
          for i in $(seq 1 200); do
            OUT=$(node flyflix-catalog-build.js --latest --max=$CHUNK 2>&1)
            echo "$OUT" | grep -E "PENDIENTES|CHUNK|COMPLETO|🧹|📄|♻|⚠|Error" | tail -20
            git add public/data/catalog-flyflix.json.partial resultados/ 2>/dev/null || true
            if git commit -m "checkpoint builder $i"; then
              for t in 1 2 3 4 5; do
                git pull --rebase --autostash && git push && break
                echo "push rechazado, reintentando en 10s..." && sleep 10
              done
            fi
            echo "$OUT" | grep -q "PENDIENTES:0" && break
          done

      - name: 3/5 Generar índice lite + detalles
        run: node split-catalog.js public/data/catalog-flyflix.json && node flyflix-shard-pack.js

      - name: 4/5 (opcional) Probe de idiomas por servidor
        if: ${{ github.event.inputs.probe_idiomas == 'si' }}
        run: node flyflix-probe-lang.js

      - name: 5/5 Regenerar índice maestro
        run: node build-master-index.js

      - name: Commit final (incluye borrados)
        run: |
          git add -A resultados public/data/catalog-flyflix.json \
                  public/data/catalog-flyflix-index.json \
                  public/data/catalog-flyflix-details \
                  public/data/catalog-index.json probe-idiomas.json
          git commit -m "Scraping flyflix ${{ github.run_number }} (completo)"
          for t in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && break
            echo "push rechazado, reintentando en 10s..." && sleep 10
          done
