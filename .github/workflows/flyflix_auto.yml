name: Flyflix Auto Scraper

on:
  schedule:
    - cron: "0 6 * * *"        # todos los días a las 06:00 UTC
  workflow_dispatch:
    inputs:
      fuente:
        description: "Fuente del catálogo"
        required: true
        default: flyflix
        type: choice
        options:
          - flyflix            # TODO el catálogo que lista flyflix.net
          - tmdb               # top N trending/populares de TMDB
      cantidad:
        description: "Top N (solo si fuente = tmdb)"
        required: true
        default: "20"
        type: string
      workers:
        description: "Workers paralelos"
        required: true
        default: "20"
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests pyyaml

      - name: Ejecutar scraper automático
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          FUENTE="${{ github.event.inputs.fuente || 'flyflix' }}"
          WORKERS="${{ github.event.inputs.workers || '20' }}"
          FECHA=$(date +%Y-%m-%d)
          if [ "$FUENTE" = "flyflix" ]; then
            python flyflix_scraper.py --flyflix --workers "$WORKERS" \
              --salida "resultados/$FECHA.json"
          else
            CANTIDAD="${{ github.event.inputs.cantidad || '20' }}"
            python flyflix_scraper.py --auto "$CANTIDAD" --fuente tmdb \
              --workers "$WORKERS" --salida "resultados/$FECHA.json"
          fi

      - name: Guardar resultados en el repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Scraping automático ${{ github.run_number }}"
          file_pattern: "resultados/*.json resultados/*.csv"
