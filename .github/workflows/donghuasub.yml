name: Sync DonghuaSub Catalog

on:
  workflow_dispatch:
    inputs:
      max_runtime_minutes:
        description: 'Tiempo máximo de ejecución (minutos)'
        required: false
        default: '300'
        type: string
      workers:
        description: 'Workers concurrentes (1-4)'
        required: false
        default: '3'
        type: string
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas

env:
  OUT_FILE: public/data/catalog-donghuasub.json
  WORKERS: ${{ github.event.inputs.workers || '3' }}
  POLITENESS_MS: '500'
  MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes || '300' }}
  MAX_EPISODE_CRAWLS: '5000'

permissions:
  contents: write

jobs:
  sync:
    name: Scrape DonghuaSub (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 📥 Checkout repositorio
        uses: actions/checkout@v4

      - name: 📥 Restaurar catálogo previo (artifact)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: donghuasub-catalog
          path: public/data

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🎭 Instalar Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install chromium --with-deps

      - name: 🚀 Ejecutar scraper DonghuaSub
        run: node scripts/syncdonghuasub.js

      - name: 💾 Subir catálogo como artifact
        uses: actions/upload-artifact@v4
        with:
          name: donghuasub-catalog
          path: ${{ env.OUT_FILE }}
          retention-days: 7

      - name: 📤 Commit del catálogo al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.OUT_FILE }}
          if git diff --staged --quiet; then
            echo "Sin cambios en el catálogo"
          else
            git commit -m "chore(sync): actualiza catálogo DonghuaSub [skip ci]"
            git push
          fi
