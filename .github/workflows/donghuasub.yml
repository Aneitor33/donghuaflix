# ══════════════════════════════════════════════
#  DONGHUASUB — donghuasub.com (con Playwright)
#  Requiere navegador para JavaScript
# ══════════════════════════════════════════════
name: Sincronizar DonghuaSub

on:
  schedule:
    - cron: '55 */6 * * *'      # cada 6h, minuto 55
  workflow_dispatch:

concurrency:
  group: sync-donghuasub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y Playwright
        run: |
          npm install
          npm i --no-save playwright
          npx playwright install chromium --with-deps

      - name: Sincronizar DonghuaSub
        env:
          WORKERS: '3'
          POLITENESS_MS: '500'
          MAX_EPISODE_CRAWLS: '5000'
          MAX_RUNTIME_MINUTES: '330'
        run: node syncdonghuasub.js

      - name: Generar índice lite y fichas
        if: always()
        run: node split-catalog.js public/data/catalog-donghuasub.json

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A 'public/data/catalog-donghuasub*'
          git diff --staged --quiet || git commit -m "sync(donghuasub): actualizar catálogo"
          git pull --rebase --autostash origin main
          git push
