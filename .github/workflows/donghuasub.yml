# ══════════════════════════════════════════════
#  DONGHUASUB — donghuasub.com
#  Catálogo: public/data/catalog-donghuasub.json
# ══════════════════════════════════════════════
name: Sincronizar DonghuaSub

on:
  schedule:
    - cron: '55 */6 * * *'      # cada 6h, minuto 55
  workflow_dispatch:

concurrency:
  group: sync-donghuasub
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar DonghuaSub
        env:
          WORKERS: '8'
          POLITENESS_MS: '300'
          MAX_EPISODE_CRAWLS: '20000'
          MAX_RUNTIME_MINUTES: '330'
        run: node syncdonghuasub.js

      - name: Generar índice lite y fichas
        if: always()
        run: node split-catalog.js public/data/catalog-donghuasub.json

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A 'public/data/catalog-donghuasub*'
          git diff --staged --quiet || git commit -m "sync(donghuasub): actualizar catálogo"
          git pull --rebase --autostash origin main
          git push

