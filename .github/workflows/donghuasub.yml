# ══════════════════════════════════════════════
#  DONGHUASUB — donghuasub.com
#  Usa syncdonghuasub.js (Playwright, serie a serie)
#  Catálogo: public/data/catalog-donghuasub.json
# ══════════════════════════════════════════════
name: Sincronizar DonghuaSub

on:
  schedule:
    - cron: '20 */6 * * *'      # cada 6h, minuto 20
  workflow_dispatch:
    inputs:
      max_runtime_minutes:
        description: 'Tiempo máximo (minutos)'
        required: false
        default: '300'
      chain_recheck_days:
        description: 'Días entre re-chequeo profundo (cadena completa)'
        required: false
        default: '7'

concurrency:
  group: sync-donghuasub
  cancel-in-progress: false

env:
  OUT_FILE: 'public/data/catalog-donghuasub.json'
  POLITENESS_MS: '500'
  MAX_RUNTIME_MINUTES: ${{ github.event.inputs.max_runtime_minutes || '300' }}
  COMPLETE_RECHECK_HOURS: '4'
  CHAIN_RECHECK_DAYS: ${{ github.event.inputs.chain_recheck_days || '7' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Instalar Playwright (Chromium)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Sincronizar DonghuaSub
        run: node syncdonghuasub.js

      - name: Generar índice lite y fichas
        if: always()
        run: node split-catalog.js public/data/catalog-donghuasub.json

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A 'public/data/catalog-donghuasub*'
          git diff --staged --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "sync(donghuasub): actualizar catálogo"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git merge origin/main -m "merge origin/main" -X ours --no-edit && git push; then
              echo "✅ Push OK"; exit 0
            fi
            echo "⚠️ Intento $i fallido, reintentando en 30s..."
            sleep 30
          done
          echo "❌ No se pudo subir tras varios intentos"; exit 1
