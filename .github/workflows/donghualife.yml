# ══════════════════════════════════════════════
#  DONGHUALIFE — donghualife.com
#  Usa el código ORIGINAL completo (syncdonghualife.js)
#  Catálogo: public/data/catalog-donghualife.json
#  Guardado con merge -X ours + reintentos: sin conflictos
#  aunque otros workflows (portadas, donghuasub) commiteen a la vez.
# ══════════════════════════════════════════════
name: Sincronizar DonghuaLife

on:
  schedule:
    - cron: '40 */6 * * *'      # cada 6h, minuto 40
  workflow_dispatch:

concurrency:
  group: sync-donghualife
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar DonghuaLife
        env:
          OUT_FILE: 'public/data/catalog-donghualife.json'
          WORKERS: '10'              # ← 10 workers en paralelo
        run: node syncdonghualife.js

      - name: Generar índice lite y fichas
        if: always()
        env:
          WORKERS: '10'              # ← por si split-catalog.js también lo usa
        run: node split-catalog.js public/data/catalog-donghualife.json

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A 'public/data/catalog-donghualife*'
          git diff --staged --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "sync(donghualife): actualizar catálogo"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git merge origin/main -m "merge origin/main" -X ours --no-edit && git push; then
              echo "✅ Push OK"; exit 0
            fi
            echo "⚠️ Intento $i fallido, reintentando en 30s..."
            sleep 30
          done
          echo "❌ No se pudo subir tras varios intentos"; exit 1
