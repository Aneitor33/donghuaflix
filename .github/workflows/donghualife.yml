# ══════════════════════════════════════════════
#  DONGHUALIFE — donghualife.com
#  Catálogo: public/data/catalog-donghualife.json
# ══════════════════════════════════════════════
name: Sincronizar DonghuaLife

on:
  schedule:
    - cron: '40 */6 * * *'      # cada 6h, minuto 40
  workflow_dispatch:

concurrency:
  group: sync-donghualife
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar DonghuaLife
        env:
          ONLY_SOURCE: 'donghualife'
          POLITENESS_MS: '500'
          MAX_EPISODE_CRAWLS: '10000'
          MAX_RUNTIME_MINUTES: '330'
        run: node syncdonghua.js

      - name: Generar índice lite y fichas
        if: always()
        run: node split-catalog.js public/data/catalog-donghualife.json

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A 'public/data/catalog-donghualife*'
          git diff --staged --quiet || git commit -m "sync(donghualife): actualizar catálogo"
          git pull --rebase --autostash origin main
          git push
