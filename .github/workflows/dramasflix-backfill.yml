name: dramasflix backfill

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'En cuántas partes dividir el trabajo (mismo valor que el run original al fusionar)'
        required: true
        default: '6'
        type: choice
        options: ['4', '6', '8']
      merge_run_id:
        description: 'RESCATE: ID del run cancelado cuyos artefactos fusionar (vacío = comportamiento normal)'
        required: false
        default: ''
        type: string
      merge_artifact_ids:
        description: 'RESCATE (recomendado): IDs de artefactos exactos, separados por comas. Evita mezclar intentos.'
        required: false
        default: ''
        type: string

concurrency:
  group: dramasflix-backfill
  cancel-in-progress: false

jobs:
  # Cada runner procesa ~1/N de los episodios. NO tocan git:
  # suben su resultado como artefacto y el job merge se encarga del repo.
  episodes:
    # En modo rescate (merge_run_id != '') solo corre el merge, no se re-rastrea nada
    if: ${{ inputs.merge_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Instalar Playwright + Chromium
        run: |
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Rastrear servidores (shard ${{ matrix.shard }}/${{ inputs.shards }})
        env:
          MODE: episodes
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ inputs.shards }}
          USE_PLAYWRIGHT: '1'
          WORKERS: '8'
          HOST_LIMIT: '8'
          FETCH_TIMEOUT_MS: '20000'
          FETCH_RETRIES: '2'
          POLITENESS_MS: '150'
          MAX_RUNTIME_MINUTES: '320'
          MAX_EPISODE_CRAWLS: '50000'
        run: node sync-dramasflix.js

      - name: Subir resultado del shard
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # El número de intento evita colisiones si se relanza el workflow
          name: shard-${{ matrix.shard }}
          path: |
            public/data/catalog-dramasflix-shard${{ matrix.shard }}.json
            public/data/catalog-dramasflix-failures-shard${{ matrix.shard }}.json
          if-no-files-found: ignore
          retention-days: 1

  # Fusiona los shards y es el ÚNICO que commitea y pushea (sin conflictos)
  merge:
    needs: episodes
    # Corre aunque algún shard falle o agote su tiempo: fusiona lo que exista
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci || npm install

      - name: Descargar shards (de este run)
        if: ${{ inputs.merge_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: public/data
          merge-multiple: true

      - name: Descargar shards (rescate por IDs exactos)
        if: ${{ inputs.merge_artifact_ids != '' }}
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ inputs.merge_artifact_ids }}
          path: public/data
          merge-multiple: true

      - name: Descargar shards (rescate por run-id)
        if: ${{ inputs.merge_run_id != '' && inputs.merge_artifact_ids == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: public/data
          merge-multiple: true
          run-id: ${{ inputs.merge_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fusionar shards en el catálogo
        env:
          MODE: merge
          SHARD_TOTAL: ${{ inputs.shards }}
        run: node sync-dramasflix.js

      - name: Dividir catálogo en índice + fichas
        run: node split-catalog.js public/data/catalog-dramasflix.json

      - name: Guardar y enviar cambios al repositorio
        if: ${{ always() }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data || true
          if git diff --staged --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "chore(data): backfill de episodios de DoramasFlix"
          git pull --rebase origin main || true
          git push || echo "⚠️ Push falló; reintenta el paso"
