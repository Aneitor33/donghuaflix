# ══════════════════════════════════════════════
#  SERIESDONGHUA — seriesdonghua.com
#  Scraper: syncseriesdonghua.js
#  Catálogo: public/data/catalog-seriesdonghua.json
#  Independiente del workflow de donghualife (nada se toca allí).
#
#  MODOS (workflow_dispatch → mode):
#    auto             → incremental si el catálogo está completo;
#                       full sync si no
#    fresh            → rebuild TOTAL desde cero (backup .bak automático)
#    refresh-servers  → re-escanea servidores de episodios YA existentes
# ══════════════════════════════════════════════
name: Sincronizar SeriesDonghua

on:
  schedule:
    - cron: '20 */6 * * *'      # cada 6h, minuto 20 (desfasado del de donghualife)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - fresh
          - refresh-servers
      only_series:
        description: 'Refresh: solo estas series (slugs separados por coma, vacío = todas)'
        required: false
        default: ''
      refresh_empty_only:
        description: 'Refresh: solo episodios que no tienen servidores'
        required: false
        default: false
        type: boolean
      max_refresh:
        description: 'Refresh: tope de episodios a refrescar (0 = sin tope)'
        required: false
        default: '0'

concurrency:
  group: sync-seriesdonghua
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar SeriesDonghua
        env:
          OUT_FILE: 'public/data/catalog-seriesdonghua.json'
          WORKERS: '10'
          FRESH: ${{ inputs.mode == 'fresh' && '1' || '' }}
          REFRESH_SERVERS: ${{ inputs.mode == 'refresh-servers' && '1' || '' }}
          ONLY_SERIES: ${{ inputs.only_series }}
          REFRESH_EMPTY_ONLY: ${{ inputs.refresh_empty_only && '1' || '' }}
          MAX_REFRESH: ${{ inputs.max_refresh != '0' && inputs.max_refresh || '999999999' }}
        run: node syncseriesdonghua.js

      - name: Generar índice lite y fichas
        if: always()
        run: node split-catalog.js public/data/catalog-seriesdonghua.json

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A 'public/data/catalog-seriesdonghua*'
          git diff --staged --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "sync(seriesdonghua): actualizar catálogo"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git merge origin/main -m "merge origin/main" -X ours --no-edit && git push; then
              echo "✅ Push OK"; exit 0
            fi
            echo "⚠️ Intento $i fallido, reintentando en 30s..."
            sleep 30
          done
          echo "❌ No se pudo subir tras varios intentos"; exit 1
