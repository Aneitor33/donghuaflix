name: fix doramasia index

on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apuntar el frontend al catálogo de DoramasIA
        run: |
          node - <<'EOF'
          const fs = require('fs');
          const file = 'app.js';
          let s = fs.readFileSync(file, 'utf8');
          if (s.includes("id: 'doramasia'")) {
            console.log('OK: app.js ya apunta a doramasia');
            process.exit(0);
          }
          const re = /\{ id: 'dramasflix',[^}]*\},?/;
          const m = s.match(re);
          if (!m) {
            console.log('ERROR: no se encontró la entrada de dramasflix en app.js');
            process.exit(1);
          }
          s = s.replace(m[0], "{ id: 'doramasia',  file: './public/data/catalog-doramasia.json',  index: './public/data/catalog-doramasia-index.json',  label: 'DoramasIA' },");
          fs.writeFileSync(file, s);
          console.log('OK: app.js actualizado');
          EOF

      - name: Guardar y enviar
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add app.js
          if git diff --staged --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "fix(web): catálogo DramasFlix → DoramasIA"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
