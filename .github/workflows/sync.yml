name: Sincronizar catálogo DonghuaFlix

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Permite ejecutarlo manualmente desde la interfaz de GitHub

# Mismo grupo que el workflow de cdramas: nunca corren a la vez
concurrency:
  group: sync-catalogos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar sincronización
        run: node sync-static.js

      - name: Sincronizar portadas
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node poster-sync.js

      - name: Guardar cambios en el catálogo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || git commit -m "sync: actualizar catálogo"
          git pull --rebase origin main
          git push
