name: dramasflix split

on:
  workflow_dispatch:

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dividir catálogo en índice + fichas
        run: node split-catalog.js public/data/catalog-dramasflix.json

      - name: Guardar y enviar
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data
          if git diff --staged --quiet; then
            echo "No hay cambios."
            exit 0
          fi
          git commit -m "chore(data): dividir catálogo de DoramasFlix en índice + fichas [skip ci]"
          git pull --rebase origin main || true
          git push
