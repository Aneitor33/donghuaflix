# ══════════════════════════════════════════════
#  PORTADAS — descarga pósters de TMDB/AniList
#  Usa poster-sync.js (uno por serie, con traducción es→en)
#  Requiere opcional: secret TMDB_API_KEY
# ══════════════════════════════════════════════
name: Sincronizar portadas

on:
  schedule:
    - cron: '0 3 * * 0'      # cada domingo a las 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar re-descarga de todas las portadas (1 = sí)'
        required: false
        default: '0'

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  FORCE_POSTERS: ${{ github.event.inputs.force || '0' }}

concurrency:
  group: sync-posters
  cancel-in-progress: false

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sincronizar portadas
        run: node poster-sync.js

      - name: Guardar portadas
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data public/img/posters
          git diff --staged --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "sync(posters): actualizar portadas e indices"
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            if git merge origin/main -m "merge origin/main" -X ours --no-edit && git push; then
              echo "✅ Push OK"; exit 0
            fi
            echo "⚠️ Intento $i fallido, reintentando en 30s..."
            sleep 30
          done
          echo "❌ No se pudo subir tras varios intentos"; exit 1
