# ══════════════════════════════════════════════
#  PORTADAS — descarga pósters de TMDB/AniList
#  SOLO DonghuaLife: los demás catálogos ya traen
#  buena portada de su propia web.
#  Rondas de 50 min con commit entre ellas: si GitHub
#  corta, solo se pierde la ronda en curso.
#  Tras cada ronda regenera el ÍNDICE LITE (lo que
#  realmente lee la web) con las nuevas portadas.
#  Requiere: secret TMDB_API_KEY (gratis en themoviedb.org)
# ══════════════════════════════════════════════
name: Sincronizar portadas

on:
  schedule:
    - cron: '0 3 * * 0'      # cada domingo a las 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar re-descarga de todas las portadas (1 = sí)'
        required: false
        default: '0'
      catalog:
        description: 'Catálogo a procesar (por defecto: donghualife)'
        required: false
        default: 'donghualife'

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  FORCE_POSTERS: ${{ github.event.inputs.force || '0' }}
  CATALOG: ${{ github.event.inputs.catalog || 'donghualife' }}

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rondas de 50 min con guardado entre ellas
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          for round in 1 2 3 4 5 6; do
            echo "══════════════════ RONDA $round ($CATALOG) ══════════════════"
            MAX_MINUTES=50 node poster-sync.js > /tmp/posters-ronda-$round.log 2>&1 || true
            tail -n 40 /tmp/posters-ronda-$round.log
            # Regenerar el ÍNDICE LITE y las fichas (lo que lee la web)
            node split-catalog.js public/data/catalog-$CATALOG.json
            git add -A public/data public/img/posters
            if ! git diff --staged --quiet; then
              git commit -m "sync(posters): $CATALOG (ronda $round)"
              for i in 1 2 3 4 5; do
                git fetch origin main
                if git merge origin/main -m "merge origin/main" -X ours --no-edit && git push; then
                  break
                fi
                echo "⚠️ Reintento de push en 30s..."; sleep 30
              done
            fi
            if grep -q '__ALL_DONE__' /tmp/posters-ronda-$round.log; then
              echo "✅ Catálogo $CATALOG COMPLETO"
              break
            fi
          done
