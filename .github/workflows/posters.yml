# ══════════════════════════════════════════════
#  PORTADAS — descarga pósters de TMDB/AniList
#  Cada catálogo corre en su PROPIO trabajo.
#  Tras cada pasada regenera el ÍNDICE LITE y las
#  fichas (shard-pack para los catálogos con shards:
#  debe coincidir con SHARDED_CATS de app.js) y hace
#  commit.
#  Requiere: secret TMDB_API_KEY (gratis en
#  themoviedb.org)
# ══════════════════════════════════════════════
name: Sincronizar portadas

on:
  schedule:
    - cron: '0 3 * * 0'      # cada domingo a las 03:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar re-descarga de todas las portadas (1 = sí)'
        required: false
        default: '0'
      catalog:
        description: 'all | donghualife | donghuasub | donghuaworld | peliculas | doramas | donghuacli'
        required: false
        default: 'all'

env:
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  FORCE_POSTERS: ${{ github.event.inputs.force || '0' }}
  ONLY: ${{ github.event.inputs.catalog || 'all' }}

jobs:
  posters:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        catalog: [donghualife, donghuasub, donghuaworld, peliculas, doramas, donghuacli]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Portadas de ${{ matrix.catalog }} — sin límite de tiempo
        run: |
          # Guard: si se pidió un catálogo concreto, los demás trabajos se omiten
          if [ "$ONLY" != "all" ] && [ "$ONLY" != "${{ matrix.catalog }}" ]; then
            echo "⏭️ Se pidió '$ONLY'; este trabajo es '${{ matrix.catalog }}' — se omite."
            exit 0
          fi

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          CATALOG=${{ matrix.catalog }}

          for round in 1 2; do
            echo "══════════════════ PASADA $round ($CATALOG) ══════════════════"
            # Sin MAX_MINUTES: corre hasta acabar el catálogo entero
            CATALOG=$CATALOG node poster-sync.js > /tmp/posters-ronda-$round.log 2>&1 || true
            tail -n 40 /tmp/posters-ronda-$round.log

            # Regenerar el ÍNDICE LITE y las fichas (lo que lee la web).
            # OJO: los catálogos de SHARDED_CATS (app.js) deben regenerarse
            # con shard-pack (agrupa en 64 shards y BORRA las fichas sueltas).
            # Con split-catalog recrearíamos miles de archivos y reventaríamos
            # el límite de 20.000 archivos de Cloudflare Pages.
            case "$CATALOG" in
              donghualife|youtubefilms|pelispedia)
                node shard-pack.js "$CATALOG" full
                ;;
              *)
                node split-catalog.js "public/data/catalog-$CATALOG.json"
                ;;
            esac

            git add -A public/data public/img/posters
            if ! git diff --staged --quiet; then
              git commit -m "sync(posters): $CATALOG (pasada $round)"
              for i in 1 2 3 4 5; do
                git fetch origin main
                if git merge origin/main -m "merge origin/main" -X ours --no-edit && git push; then
                  break
                fi
                echo "⚠️ Reintento de push en 30s..."; sleep 30
              done
            fi

            if grep -q '__ALL_DONE__' /tmp/posters-ronda-$round.log; then
              echo "✅ Catálogo $CATALOG COMPLETO"
              break
            fi
          done
