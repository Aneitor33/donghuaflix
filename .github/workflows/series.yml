name: Sincronizar catálogo Series

on:
  schedule:
    - cron: '0 2,14 * * *'
  workflow_dispatch:

concurrency:
  group: sync-catalogos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar sincronización de Series
        env:
          SOURCE_URL: https://seriesflixhd.team
          SEEDS: "/series-online"
          LINK_PREFIXES: /serie/,/series/
          ALLOW_CROSS_ORIGIN: '1'
          OUT_FILE: public/data/catalog-series.json
          CATALOG_TAG: series
          MAX_DISCOVERY_PAGES: 999
          SERVER_BLACKLIST: streamhg,earnvids,streamruby,smoothie,playerwish,upstream,dropload
        run: node sync-source.js

      - name: Sincronizar portadas (TMDB/AniList)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node poster-sync.js

      - name: Guardar cambios en el catálogo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff-index --quiet HEAD || git commit -m "sync: actualizar catálogo series"
          git pull --rebase origin main
          git push
