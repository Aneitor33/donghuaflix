# ══════════════════════════════════════════════
#  SERIES — pelicinehd.com (series + temporadas + episodios)
#  Catálogo: public/data/catalog-series.json
# ══════════════════════════════════════════════
name: Sincronizar series (PeliCineHD)

on:
  schedule:
    - cron: '40 */6 * * *'      # cada 6h, minuto 40
  workflow_dispatch:

concurrency:
  group: sync-pelicinehd-series
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar sync de series
        env:
          SOURCE_URL: 'https://pelicinehd.com'
          OUT_FILE: 'public/data/catalog-series.json'
          CATALOG_TAG: 'serie'
          SEEDS: '/series/'
          LINK_PREFIXES: '/series/'
          MAX_DISCOVERY_PAGES: '500'
          ALLOW_CROSS_ORIGIN: '1'
          WORKERS: '4'
          POLITENESS_MS: '150'
        run: node sync-source.js

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/catalog-series.json public/data/catalog-series.part*.json
          git diff --staged --quiet || git commit -m "sync(series): actualizar catálogo [skip ci]"
          git pull --rebase origin main
          git push
