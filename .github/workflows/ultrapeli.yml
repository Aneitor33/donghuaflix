# ══════════════════════════════════════════════
#  PELÍCULAS — ultrapeli.com (SOLO películas)
#  Catálogo: public/data/catalog-ultrapeli.json
# ══════════════════════════════════════════════
name: Sincronizar películas (Ultrapeli)

on:
  schedule:
    - cron: '50 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-ultrapeli
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: npm install
      - name: Ejecutar sync de películas
        env:
          SOURCE_URL: 'https://ultrapeli.com'
          OUT_FILE: 'public/data/catalog-ultrapeli.json'
          CATALOG_TAG: 'ultrapeli'
          SEEDS: '/movies/'
          LINK_PREFIXES: '/movies/'
          MOVIE_PREFIXES: '/movies/'
          ONLY_MOVIES: '1'
          MAX_DISCOVERY_PAGES: '50'
          WORKERS: '4'
          POLITENESS_MS: '150'
        run: node sync-source.js
      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data/
          git diff --staged --quiet || git commit -m "sync(ultrapeli): actualizar catálogo [skip ci]"
          git pull --rebase origin main
          git push
