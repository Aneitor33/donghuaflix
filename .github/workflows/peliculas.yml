name: Sincronizar catálogo PeliCineHD

on:
  schedule:
    # Ejecutar cada hora
    - cron: "0 * * * *"

  # Permite ejecutarlo manualmente desde GitHub
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peliculas-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # ─────────────────────────────────────────────
      # 1. Descargar el repositorio
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # 2. Configurar Node.js
      # ─────────────────────────────────────────────
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ─────────────────────────────────────────────
      # 3. Instalar dependencias
      # ─────────────────────────────────────────────
      - name: Instalar dependencias
        run: npm install

      # ─────────────────────────────────────────────
      # 4. Ejecutar sincronización PeliCineHD
      # ─────────────────────────────────────────────
      - name: Sincronizar catálogo
        env:
          SOURCE_URL: https://pelicinehd.com

          # Catálogo principal
          MOVIES_INDEX: /peliculas/

          # Archivo de películas
          MOVIES_ARCHIVE: /movies/

          # Prefijo de las fichas individuales
          MOVIE_PREFIX: /movies/

          # Número de páginas que se revisan durante
          # una actualización incremental.
          INCREMENTAL_PAGES: 5

          # Primera sincronización completa.
          # El scraper decidirá automáticamente si
          # necesita reconstruir o actualizar.
          FULL_SYNC: false

          # Número máximo de páginas durante una
          # reconstrucción completa.
          MAX_DISCOVERY_PAGES: 150

          # Número de películas procesadas simultáneamente.
          WORKERS: 6

          # Espera entre peticiones.
          POLITENESS_MS: 500

          # Tiempo máximo de espera de una petición.
          REQUEST_TIMEOUT_MS: 30000

          # Número de reintentos.
          RETRIES: 3

          # Guardar progreso cada X películas.
          CHECKPOINT_EVERY: 10

        run: node sync-source.js

      # ─────────────────────────────────────────────
      # 5. Sincronizar portadas
      # ─────────────────────────────────────────────
      - name: Sincronizar portadas
        run: |
          if [ -f poster-sync.js ]; then
            node poster-sync.js
          else
            echo "poster-sync.js no existe; se omite."
          fi

      # ─────────────────────────────────────────────
      # 6. Comprobar cambios
      # ─────────────────────────────────────────────
      - name: Comprobar cambios
        id: changes
        run: |
          git status --short

          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ─────────────────────────────────────────────
      # 7. Guardar catálogo actualizado
      # ─────────────────────────────────────────────
      - name: Guardar cambios
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/data/catalog-peliculas.json

          if [ -f public/data/catalog-peliculas.json ]; then
            git add public/data/catalog-peliculas.json
          fi

          if [ -d public/data/posters ]; then
            git add public/data/posters
          fi

          git commit -m "sync: actualizar catálogo PeliCineHD [skip ci]"

          git push

      # ─────────────────────────────────────────────
      # 8. Mostrar resultado
      # ─────────────────────────────────────────────
      - name: Finalizar
        run: |
          echo "────────────────────────────────────"
          echo "Sincronización PeliCineHD finalizada"
          echo "Fuente: https://pelicinehd.com"
          echo "────────────────────────────────────"
