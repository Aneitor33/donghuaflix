# ══════════════════════════════════════════════
#  PELÍCULAS — pelispedia.mov (SOLO películas)
#  Catálogo: public/data/catalog-peliculas.json
#  + índice lite y fichas por película
# ══════════════════════════════════════════════
name: Sincronizar películas (Pelispedia)

on:
  schedule:
    - cron: '20 */6 * * *'      # cada 6h, minuto 20
  workflow_dispatch:

concurrency:
  group: sync-pelispedia-peliculas
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar sync de películas
        env:
          SOURCE_URL: 'https://pelispedia.mov'
          OUT_FILE: 'public/data/catalog-peliculas.json'
          CATALOG_TAG: 'pelicula'
          SEEDS: '/peliculas'
          LINK_PREFIXES: '/pelicula/'
          MOVIE_PREFIXES: '/pelicula/'
          ONLY_MOVIES: '1'
          MAX_DISCOVERY_PAGES: '500'
          WORKERS: '7'
          POLITENESS_MS: '150'
        run: node sync-source.js

      # ── NUEVO: índice lite + una ficha por película ──
      - name: Generar índice lite y fichas
        if: always()
        run: node split-catalog.js public/data/catalog-peliculas.json

      - name: Guardar catálogo
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A public/data/
          git diff --staged --quiet || git commit -m "sync(peliculas): actualizar catálogo [skip ci]"
          git pull --rebase origin main
          git push
