name: Sync YouTube Films

on:
  schedule:
    # Cada 6 horas (ajustable)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-youtubefilms
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape pestaña "Videos" de canales autorizados
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MIN_DURATION_SECONDS: '3600'
          MAX_VIDEOS_PER_CHANNEL: '1000'
        run: node sync-youtubefilms.js

      - name: Reconstruir índice maestro
        run: node build-master-index.js

      - name: Commit y push de los cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Evita el rechazo "fetch first" si hubo commits desde la web mientras corría
          git pull --rebase --autostash origin main || true
          git add -A public/data/
          git commit -m "chore(data): sync catálogo YouTube Films" || echo "Sin cambios"
          git push
